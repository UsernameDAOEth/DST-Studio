openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: DST Signal Engine — DJZS Audit Protocol
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Trading signal operations
  - name: market
    description: Market data operations
  - name: watchlist
    description: Watchlist management
  - name: alerts
    description: Alert management
  - name: audit
    description: Signal audit operations
  - name: agent
    description: Chat agent operations
  - name: integrations
    description: Integration scaffold and settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get latest signals for all watched assets
      parameters:
        - name: asset
          in: query
          schema:
            type: string
          description: Filter by asset symbol (e.g. ETH, BTC, SOL)
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [1H, 4H, 1D]
            default: 4H
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/{asset}:
    get:
      operationId: getSignalByAsset
      tags: [signals]
      summary: Get the latest signal for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signal with full breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalDetail"

  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get market snapshot for all tracked assets
      responses:
        "200":
          description: Market snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSnapshot"

  /market/snapshot/{asset}:
    get:
      operationId: getMarketSnapshotByAsset
      tags: [market]
      summary: Get market snapshot for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"

  /audit/{asset}:
    get:
      operationId: getAuditByAsset
      tags: [audit]
      summary: Get full DJZS audit breakdown for an asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full DJZS audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get all watchlist entries
      responses:
        "200":
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistEntry"

    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add an asset to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistEntry"
      responses:
        "201":
          description: Created watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"

  /watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove an asset from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get all alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlert"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a command to the DST agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReply"

  /signals/feed:
    get:
      operationId: getSignalFeed
      tags: [signals]
      summary: Get chronological signal feed for all assets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Signal feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalFeedEntry"

  /integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: Get status of all integration scaffolds
      responses:
        "200":
          description: List of integration statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}/toggle:
    post:
      operationId: toggleIntegration
      tags: [integrations]
      summary: Enable or disable an integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}:
    get:
      operationId: getIntegrationByName
      tags: [integrations]
      summary: Get status of a specific integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Signal:
      type: object
      description: >
        A disciplined pre-trade process report. Every signal includes a full
        pre-trade checklist, process verdict, logic admissibility, and explicit
        reject conditions. WAIT is the default when any required field is missing.
      properties:
        id:
          type: integer
        asset:
          type: string
        timeframe:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT, WAIT]
          description: Raw directional signal from the market structure analysis
        confidence:
          type: number
          description: Confidence score 0-100
        verdictDjzs:
          type: string
          enum: [PASS, FAIL, WAIT]
          description: DJZS logic admissibility audit verdict
        processVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
          description: >
            Pre-trade process verdict. APPROVED = all checklist items present and
            valid. REJECTED = one or more hard rules violated. DEGRADED = setup
            is valid but penalized (late entry, narrative risk, etc.).
        logicAdmissibility:
          type: string
          enum: [ADMISSIBLE, INADMISSIBLE, CONDITIONAL]
          description: >
            Whether the signal passes structural logic rules. Separate from
            market direction and from the DJZS audit verdict.
        setupFamily:
          type: string
          enum: [TREND_CONTINUATION_LONG, TREND_CONTINUATION_SHORT, RANGE_LONG, RANGE_SHORT, NO_SETUP]
          description: Classified setup type. Trend continuation is the primary family.
        entryQuality:
          type: string
          enum: [OPTIMAL, ACCEPTABLE, LATE, INVALID]
          description: Quality grade for the entry timing based on ATR extension and structure.
        narrativeRisk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: >
            Risk that the setup is driven by narrative rather than structure.
            HIGH narrative risk penalizes or rejects the setup.
        rrRatio:
          type: number
          description: Reward-to-risk ratio. Signals with rrRatio < 1.5 are rejected.
        thesis:
          type: string
          description: One-sentence pre-trade thesis for this setup.
        whyTrade:
          type: string
          description: >
            Concise explanation of why this is or is not an actionable trade.
            Always present, even for WAIT signals.
        rejectIf:
          type: array
          items:
            type: string
          description: >
            Explicit conditions that would invalidate this signal if triggered.
            e.g. "Price closes below EMA50", "OI drops > 15% in 4H".
        rejectionCodes:
          type: array
          items:
            type: string
          description: >
            Machine-readable codes for why the setup was rejected or degraded.
            Possible values: NO_REGIME, ENTRY_TOO_LATE, STOP_INVALID,
            TARGET_UNREALISTIC, NARRATIVE_HEAVY, CONFLICTING_SIGNALS,
            CROWDING_TOO_HIGH, NO_INVALIDATION, RR_BELOW_THRESHOLD,
            CONFIDENCE_STRUCTURE_MISMATCH, UNDEFINED_REGIME, RANGE_SECONDARY.
        processQualityGrade:
          type: string
          enum: [A, B, C, D, F]
          description: >
            Overall process quality grade. Reflects discipline of the setup
            independent of market outcome.
        entryZoneLow:
          type: number
        entryZoneHigh:
          type: number
        targetZone:
          type: number
        invalidationPrice:
          type: number
        reasonCodes:
          type: array
          items:
            type: string
          description: Positive signal reason codes
        computedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - timeframe
        - direction
        - confidence
        - verdictDjzs
        - processVerdict
        - logicAdmissibility
        - setupFamily
        - entryQuality
        - narrativeRisk
        - rrRatio
        - thesis
        - whyTrade
        - rejectIf
        - rejectionCodes
        - processQualityGrade
        - reasonCodes
        - computedAt

    SignalDetail:
      allOf:
        - $ref: "#/components/schemas/Signal"
        - type: object
          properties:
            marketSnapshot:
              $ref: "#/components/schemas/MarketSnapshot"
            trendRegime:
              $ref: "#/components/schemas/TrendRegime"
            openInterestContext:
              $ref: "#/components/schemas/OIContext"
            auditReport:
              $ref: "#/components/schemas/AuditReport"
            preTradChecklist:
              $ref: "#/components/schemas/PreTradeChecklist"
            outcomeTracking:
              $ref: "#/components/schemas/OutcomeTracking"

    PreTradeChecklist:
      type: object
      description: >
        Structured pre-trade checklist that must be complete before a signal
        can be APPROVED. Missing required fields force a WAIT output.
      properties:
        thesis:
          type: string
        regimeConfirmed:
          type: boolean
        entryZoneDefined:
          type: boolean
        invalidationDefined:
          type: boolean
        targetDefined:
          type: boolean
        reasonCodesPresent:
          type: boolean
        rejectConditionsDefined:
          type: boolean
        rrRatioAcceptable:
          type: boolean
        checklistComplete:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
      required:
        - thesis
        - regimeConfirmed
        - entryZoneDefined
        - invalidationDefined
        - targetDefined
        - reasonCodesPresent
        - rejectConditionsDefined
        - rrRatioAcceptable
        - checklistComplete
        - missingFields

    OutcomeTracking:
      type: object
      description: >
        Scaffolded outcome tracking for process-vs-outcome separation.
        All fields null until outcome tracking is enabled in a future phase.
      properties:
        scaffolded:
          type: boolean
          description: Always true — outcome tracking is not yet live
        entryFilled:
          type: boolean
          nullable: true
        exitPrice:
          type: number
          nullable: true
        pnlPct:
          type: number
          nullable: true
        outcome:
          type: string
          enum: [WIN, LOSS, BREAKEVEN, OPEN, PENDING]
          nullable: true
        processScore:
          type: number
          nullable: true
          description: Process quality score independent of outcome
      required:
        - scaffolded

    MarketSnapshot:
      type: object
      properties:
        asset:
          type: string
        price:
          type: number
        priceChange24h:
          type: number
        priceChangePct24h:
          type: number
        volume24h:
          type: number
        marketCap:
          type: number
        totalValueLocked:
          type: number
        defiLlamaSlug:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - asset
        - price
        - priceChange24h
        - priceChangePct24h
        - updatedAt

    TrendRegime:
      type: object
      properties:
        asset:
          type: string
        regime:
          type: string
          enum: [BULL, BEAR, RANGING, UNDEFINED]
        ema9:
          type: number
        ema21:
          type: number
        ema50:
          type: number
        rsi:
          type: number
        macdHistogram:
          type: number
        atr:
          type: number
        trendStrength:
          type: number
          description: 0-100
      required:
        - asset
        - regime

    OIContext:
      type: object
      properties:
        asset:
          type: string
        openInterest:
          type: number
        oiChange24h:
          type: number
        oiChangePct24h:
          type: number
        fundingRate:
          type: number
        longShortRatio:
          type: number
        dominantSide:
          type: string
          enum: [LONG, SHORT, NEUTRAL]
      required:
        - asset
        - dominantSide

    AuditReport:
      type: object
      properties:
        asset:
          type: string
        verdict:
          type: string
          enum: [PASS, FAIL, WAIT]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AuditCheck"
        summary:
          type: string
        generatedAt:
          type: string
          format: date-time
      required:
        - asset
        - verdict
        - checks
        - summary
        - generatedAt

    AuditCheck:
      type: object
      properties:
        name:
          type: string
        result:
          type: string
          enum: [PASS, FAIL, WARN, SKIP]
        detail:
          type: string
        weight:
          type: number
      required:
        - name
        - result
        - detail
        - weight

    WatchlistEntry:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        timeframe:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - timeframe
        - addedAt

    CreateWatchlistEntry:
      type: object
      properties:
        asset:
          type: string
        timeframe:
          type: string
          enum: [1H, 4H, 1D]
          default: 4H
      required:
        - asset

    Alert:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        condition:
          type: string
          enum: [LONG_SIGNAL, SHORT_SIGNAL, PRICE_ABOVE, PRICE_BELOW, DJZS_PASS, PROCESS_APPROVED]
        threshold:
          type: number
        active:
          type: boolean
        triggeredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - condition
        - active
        - createdAt

    CreateAlert:
      type: object
      properties:
        asset:
          type: string
        condition:
          type: string
          enum: [LONG_SIGNAL, SHORT_SIGNAL, PRICE_ABOVE, PRICE_BELOW, DJZS_PASS, PROCESS_APPROVED]
        threshold:
          type: number
      required:
        - asset
        - condition

    AgentChatRequest:
      type: object
      properties:
        message:
          type: string
        sessionId:
          type: string
      required:
        - message

    AgentReply:
      type: object
      properties:
        reply:
          type: string
        command:
          type: string
        data:
          type: object
          additionalProperties: true
        sessionId:
          type: string
      required:
        - reply
        - sessionId

    SignalFeedEntry:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT, WAIT]
        verdict:
          type: string
          enum: [PASS, FAIL, WAIT]
        processVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
        setupFamily:
          type: string
          enum: [TREND_CONTINUATION_LONG, TREND_CONTINUATION_SHORT, RANGE_LONG, RANGE_SHORT, NO_SETUP]
        confidence:
          type: number
        rrRatio:
          type: number
        summary:
          type: string
        computedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - direction
        - verdict
        - processVerdict
        - setupFamily
        - confidence
        - rrRatio
        - summary
        - computedAt

    IntegrationStatus:
      type: object
      description: >
        Scaffold entry for a planned system integration.
        All integrations are off by default until configured and enabled.
      properties:
        name:
          type: string
          description: Machine-readable integration name
        displayName:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [SCHEDULER, PRICE_FEED, RESEARCH, ALERTS, ENRICHMENT]
        enabled:
          type: boolean
        configured:
          type: boolean
          description: Whether required env vars / credentials are present
        status:
          type: string
          enum: [ACTIVE, DISABLED, NOT_CONFIGURED, COMING_SOON]
        envKeyRequired:
          type: string
          nullable: true
          description: Name of the required environment variable
        docsUrl:
          type: string
          nullable: true
        phase:
          type: string
          description: Which expansion phase this integration belongs to (e.g. "Phase 2")
      required:
        - name
        - displayName
        - description
        - category
        - enabled
        - configured
        - status
        - phase
