openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: DST Signal Engine — DJZS Audit Protocol
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Trading signal operations
  - name: market
    description: Market data operations
  - name: watchlist
    description: Watchlist management
  - name: alerts
    description: Alert management
  - name: audit
    description: Signal audit operations
  - name: agent
    description: Chat agent operations
  - name: integrations
    description: Integration scaffold and settings
  - name: hermes
    description: Hermes orchestration runtime — scan loop, constraints, metrics, evaluation
  - name: pyth
    description: Pyth Network live price and confidence data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get latest signals for all watched assets
      parameters:
        - name: asset
          in: query
          schema:
            type: string
          description: Filter by asset symbol (e.g. ETH, BTC, SOL)
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [1H, 4H, 1D]
            default: 4H
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/{asset}:
    get:
      operationId: getSignalByAsset
      tags: [signals]
      summary: Get the latest signal for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signal with full breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalDetail"

  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get market snapshot for all tracked assets
      responses:
        "200":
          description: Market snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSnapshot"

  /market/snapshot/{asset}:
    get:
      operationId: getMarketSnapshotByAsset
      tags: [market]
      summary: Get market snapshot for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"

  /audit/{asset}:
    get:
      operationId: getAuditByAsset
      tags: [audit]
      summary: Get full DJZS audit breakdown for an asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
        - name: signalId
          in: query
          required: false
          schema:
            type: integer
          description: Pin audit to a specific signal snapshot by ID
      responses:
        "200":
          description: Full DJZS audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get all watchlist entries
      responses:
        "200":
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistEntry"

    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add an asset to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistEntry"
      responses:
        "201":
          description: Created watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"

  /watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove an asset from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get all alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlert"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a command to the DST agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReply"

  /signals/feed:
    get:
      operationId: getSignalFeed
      tags: [signals]
      summary: Get chronological signal feed for all assets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Signal feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalFeedEntry"

  /integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: Get status of all integration scaffolds
      responses:
        "200":
          description: List of integration statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}/toggle:
    post:
      operationId: toggleIntegration
      tags: [integrations]
      summary: Enable or disable an integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}:
    get:
      operationId: getIntegrationByName
      tags: [integrations]
      summary: Get status of a specific integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /hermes/status:
    get:
      operationId: getHermesStatus
      tags: [hermes]
      summary: Get current Hermes scan loop status and job queue
      responses:
        "200":
          description: Hermes status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesScanStatus"

  /hermes/constraints:
    get:
      operationId: getHermesConstraints
      tags: [hermes]
      summary: Get current Hermes system constraints
      responses:
        "200":
          description: Current constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesConstraints"
    put:
      operationId: updateHermesConstraints
      tags: [hermes]
      summary: Update Hermes system constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesConstraintsUpdate"
      responses:
        "200":
          description: Updated constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesConstraints"

  /hermes/metrics:
    get:
      operationId: getHermesMetrics
      tags: [hermes]
      summary: Get stage accuracy and evaluation metrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [24H, 7D, 30D]
            default: 7D
      responses:
        "200":
          description: Hermes metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesMetrics"

  /hermes/scan:
    post:
      operationId: triggerHermesScan
      tags: [hermes]
      summary: Trigger a manual Hermes scan for all tracked assets
      responses:
        "200":
          description: Scan job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesScanResult"

  /hermes/evaluation:
    get:
      operationId: getHermesEvaluation
      tags: [hermes]
      summary: Get weekly evaluation report for threshold and rule review
      responses:
        "200":
          description: Evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesEvaluation"

  /hermes/jobs:
    get:
      operationId: getHermesJobs
      tags: [hermes]
      summary: Get recent Hermes job runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HermesJob"

  /hermes/board:
    get:
      operationId: getHermesBoard
      tags: [hermes]
      summary: Get the Hermes Kanban runtime board with lanes, workers, and system health
      responses:
        "200":
          description: Hermes board state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesBoard"

  /hermes/runs:
    get:
      operationId: getHermesRuns
      tags: [hermes]
      summary: Get recent Hermes scan runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HermesRun"
    post:
      operationId: createHermesRun
      tags: [hermes]
      summary: Create and start a new Hermes scan run for a specific asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHermesRunRequest"
      responses:
        "201":
          description: Run created and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesRun"

  /hermes/runs/{runId}:
    get:
      operationId: getHermesRun
      tags: [hermes]
      summary: Get a specific Hermes run with full task detail
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesRun"
        "404":
          description: Run not found

  /hermes/runs/{runId}/tasks/{taskId}/retry:
    post:
      operationId: retryHermesTask
      tags: [hermes]
      summary: Retry a failed Hermes task
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesTask"
        "404":
          description: Run or task not found
        "400":
          description: Task not in a retryable state

  /hermes/workers:
    get:
      operationId: getHermesWorkers
      tags: [hermes]
      summary: Get current Hermes worker statuses
      responses:
        "200":
          description: Workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HermesWorker"

  /hermes/findings:
    post:
      operationId: submitHermesFinding
      tags: [hermes]
      summary: Submit a structured Hermes monitoring finding (evidence ingress)
      description: >
        Protected ingress endpoint for Hermes agent findings. Hermes submits
        structured observations only — confidence is metadata, suggested flags
        are hints, not verdicts. DJZS remains the sole deterministic audit gate.
        Findings are stored and optionally attached to trade packets as read-only
        context. Hermes never approves, rejects, scores, or overrides DJZS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFindingRequest"
      responses:
        "201":
          description: Finding accepted and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitFindingAccepted"
        "400":
          description: Validation error — finding rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  details:
                    type: object
                    additionalProperties: true
                required: [error]
    get:
      operationId: getHermesFindings
      tags: [hermes]
      summary: Get recent Hermes findings across all assets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent findings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentFinding"

  /hermes/findings/{target}:
    get:
      operationId: getHermesFindingsForTarget
      tags: [hermes]
      summary: Get active Hermes findings for a specific asset target
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
          description: Asset symbol (e.g. ETH, BTC, SOL)
      responses:
        "200":
          description: Active findings for this asset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentFinding"

  /pyth/prices:
    get:
      operationId: getPythPrices
      tags: [pyth]
      summary: Get Pyth Network live price and confidence for all tracked assets
      responses:
        "200":
          description: Pyth price data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PythPriceData"

  /pyth/prices/{asset}:
    get:
      operationId: getPythPriceByAsset
      tags: [pyth]
      summary: Get Pyth price and confidence for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pyth price data for asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PythPriceData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Signal:
      type: object
      description: >
        A disciplined pre-trade process report. Every signal includes a full
        pre-trade checklist, process verdict, logic admissibility, and explicit
        reject conditions. WAIT is the default when any required field is missing.
      properties:
        id:
          type: integer
        asset:
          type: string
        timeframe:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT, WAIT]
          description: Raw directional signal from the market structure analysis
        confidence:
          type: number
          description: Confidence score 0-100
        verdictDjzs:
          type: string
          enum: [PASS, FAIL, WAIT]
          description: DJZS logic admissibility audit verdict
        processVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
          description: >
            Pre-trade process verdict. APPROVED = all checklist items present and
            valid. REJECTED = one or more hard rules violated. DEGRADED = setup
            is valid but penalized (late entry, narrative risk, etc.).
        logicAdmissibility:
          type: string
          enum: [ADMISSIBLE, INADMISSIBLE, CONDITIONAL]
          description: >
            Whether the signal passes structural logic rules. Separate from
            market direction and from the DJZS audit verdict.
        setupFamily:
          type: string
          enum: [TREND_CONTINUATION_LONG, TREND_CONTINUATION_SHORT, RANGE_LONG, RANGE_SHORT, NO_SETUP]
          description: Classified setup type. Trend continuation is the primary family.
        entryQuality:
          type: string
          enum: [OPTIMAL, ACCEPTABLE, LATE, INVALID]
          description: Quality grade for the entry timing based on ATR extension and structure.
        narrativeRisk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: >
            Risk that the setup is driven by narrative rather than structure.
            HIGH narrative risk penalizes or rejects the setup.
        rrRatio:
          type: number
          description: Reward-to-risk ratio. Signals with rrRatio < 1.5 are rejected.
        thesis:
          type: string
          description: One-sentence pre-trade thesis for this setup.
        whyTrade:
          type: string
          description: >
            Concise explanation of why this is or is not an actionable trade.
            Always present, even for WAIT signals.
        rejectIf:
          type: array
          items:
            type: string
          description: >
            Explicit conditions that would invalidate this signal if triggered.
            e.g. "Price closes below EMA50", "OI drops > 15% in 4H".
        rejectionCodes:
          type: array
          items:
            type: string
          description: >
            Machine-readable codes for why the setup was rejected or degraded.
            Signal logic codes: NO_REGIME, ENTRY_TOO_LATE, STOP_INVALID,
            TARGET_UNREALISTIC, NARRATIVE_HEAVY, CONFLICTING_SIGNALS,
            CROWDING_TOO_HIGH, NO_INVALIDATION, RR_BELOW_THRESHOLD,
            CONFIDENCE_STRUCTURE_MISMATCH, UNDEFINED_REGIME, RANGE_SECONDARY.
            Data-quality codes: DATA_UNAVAILABLE (price missing or zero — hard
            WAIT), STALE_PRICE (DefiLlama timestamp older than 5 minutes —
            degrades signal), INSUFFICIENT_HISTORY (fewer than 50 4H bars —
            indicators unreliable), FALLBACK_PRICE_USED (fetch failed, zero
            used as fallback — hard WAIT).
        processQualityGrade:
          type: string
          enum: [A, B, C, D, F]
          description: >
            Overall process quality grade. Reflects discipline of the setup
            independent of market outcome.
        entryZoneLow:
          type: number
        entryZoneHigh:
          type: number
        targetZone:
          type: number
        invalidationPrice:
          type: number
        reasonCodes:
          type: array
          items:
            type: string
          description: Positive signal reason codes
        computedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - timeframe
        - direction
        - confidence
        - verdictDjzs
        - processVerdict
        - logicAdmissibility
        - setupFamily
        - entryQuality
        - narrativeRisk
        - rrRatio
        - thesis
        - whyTrade
        - rejectIf
        - rejectionCodes
        - processQualityGrade
        - reasonCodes
        - computedAt

    SignalDetail:
      allOf:
        - $ref: "#/components/schemas/Signal"
        - type: object
          properties:
            marketSnapshot:
              $ref: "#/components/schemas/MarketSnapshot"
            trendRegime:
              $ref: "#/components/schemas/TrendRegime"
            openInterestContext:
              $ref: "#/components/schemas/OIContext"
            auditReport:
              $ref: "#/components/schemas/AuditReport"
            preTradChecklist:
              $ref: "#/components/schemas/PreTradeChecklist"
            outcomeTracking:
              $ref: "#/components/schemas/OutcomeTracking"
            dataQuality:
              $ref: "#/components/schemas/DataQualityReport"
              description: >
                Data provenance and quality report for this signal. Surfaces
                source hierarchy, freshness, quality flags, and the Pyth
                secondary verifier result. Degrade or WAIT signals appear here
                when data quality falls below threshold.
            hermesContext:
              $ref: "#/components/schemas/HermesFindingsContext"
              description: >
                Active Hermes monitoring findings adapted as read-only audit
                context for this trade packet. Confidence and suggested flags
                from findings are metadata only — they never influence the DJZS
                verdict. Null when no active findings exist for this asset.
            verificationReport:
              $ref: "#/components/schemas/VerificationReport"
              description: >
                Structured fast-path verification report for the canonical
                normalized input packet. Exposes per-check results with explicit
                failure-mode codes, source dependencies, and hard/soft
                classification. Hard failures short-circuit to WAIT immediately.
                Hermes findings are evidence only and have no role in this report.
            packetHash:
              type: string
              description: >
                SHA-256 content hash (first 16 hex chars) of the canonical
                normalized input packet. Same normalized input always produces
                the same hash — enabling deterministic identity and replay
                verification.

    PreTradeChecklist:
      type: object
      description: >
        Structured pre-trade checklist that must be complete before a signal
        can be APPROVED. Missing required fields force a WAIT output.
      properties:
        thesis:
          type: string
        regimeConfirmed:
          type: boolean
        entryZoneDefined:
          type: boolean
        invalidationDefined:
          type: boolean
        targetDefined:
          type: boolean
        reasonCodesPresent:
          type: boolean
        rejectConditionsDefined:
          type: boolean
        rrRatioAcceptable:
          type: boolean
        checklistComplete:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
      required:
        - thesis
        - regimeConfirmed
        - entryZoneDefined
        - invalidationDefined
        - targetDefined
        - reasonCodesPresent
        - rejectConditionsDefined
        - rrRatioAcceptable
        - checklistComplete
        - missingFields

    OutcomeTracking:
      type: object
      description: >
        Scaffolded outcome tracking for process-vs-outcome separation.
        All fields null until outcome tracking is enabled in a future phase.
      properties:
        scaffolded:
          type: boolean
          description: Always true — outcome tracking is not yet live
        entryFilled:
          type: boolean
          nullable: true
        exitPrice:
          type: number
          nullable: true
        pnlPct:
          type: number
          nullable: true
        outcome:
          type: string
          enum: [WIN, LOSS, BREAKEVEN, OPEN, PENDING]
          nullable: true
        processScore:
          type: number
          nullable: true
          description: Process quality score independent of outcome
      required:
        - scaffolded

    MarketSnapshot:
      type: object
      properties:
        asset:
          type: string
        price:
          type: number
        priceChange24h:
          type: number
        priceChangePct24h:
          type: number
        volume24h:
          type: number
        marketCap:
          type: number
        totalValueLocked:
          type: number
        defiLlamaSlug:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - asset
        - price
        - priceChange24h
        - priceChangePct24h
        - updatedAt

    TrendRegime:
      type: object
      properties:
        asset:
          type: string
        regime:
          type: string
          enum: [BULL, BEAR, RANGING, UNDEFINED]
        ema9:
          type: number
        ema21:
          type: number
        ema50:
          type: number
        rsi:
          type: number
        macdHistogram:
          type: number
        atr:
          type: number
        trendStrength:
          type: number
          description: 0-100
      required:
        - asset
        - regime

    OIContext:
      type: object
      properties:
        asset:
          type: string
        openInterest:
          type: number
        oiChange24h:
          type: number
        oiChangePct24h:
          type: number
        fundingRate:
          type: number
        longShortRatio:
          type: number
        dominantSide:
          type: string
          enum: [LONG, SHORT, NEUTRAL]
      required:
        - asset
        - dominantSide

    AuditReport:
      type: object
      properties:
        asset:
          type: string
        verdict:
          type: string
          enum: [PASS, FAIL, WAIT]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AuditCheck"
        summary:
          type: string
        generatedAt:
          type: string
          format: date-time
        pinned:
          type: boolean
          description: Whether this audit report was pinned to a specific signal snapshot
        pinnedSignalId:
          type: integer
          description: The signal ID this audit is pinned to, present only when pinned is true
      required:
        - asset
        - verdict
        - checks
        - summary
        - generatedAt
        - pinned

    AuditCheck:
      type: object
      properties:
        name:
          type: string
        result:
          type: string
          enum: [PASS, FAIL, WARN, SKIP]
