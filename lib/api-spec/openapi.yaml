openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: DST Signal Engine — DJZS Audit Protocol
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: signals
    description: Trading signal operations
  - name: market
    description: Market data operations
  - name: watchlist
    description: Watchlist management
  - name: alerts
    description: Alert management
  - name: audit
    description: Signal audit operations
  - name: agent
    description: Chat agent operations
  - name: integrations
    description: Integration scaffold and settings
  - name: hermes
    description: Hermes orchestration runtime — scan loop, constraints, metrics, evaluation
  - name: pyth
    description: Pyth Network live price and confidence data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get latest signals for all watched assets
      parameters:
        - name: asset
          in: query
          schema:
            type: string
          description: Filter by asset symbol (e.g. ETH, BTC, SOL)
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [1H, 4H, 1D]
            default: 4H
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/{asset}:
    get:
      operationId: getSignalByAsset
      tags: [signals]
      summary: Get the latest signal for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signal with full breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalDetail"

  /market/snapshot:
    get:
      operationId: getMarketSnapshot
      tags: [market]
      summary: Get market snapshot for all tracked assets
      responses:
        "200":
          description: Market snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketSnapshot"

  /market/snapshot/{asset}:
    get:
      operationId: getMarketSnapshotByAsset
      tags: [market]
      summary: Get market snapshot for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"

  /audit/{asset}:
    get:
      operationId: getAuditByAsset
      tags: [audit]
      summary: Get full DJZS audit breakdown for an asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full DJZS audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReport"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: Get all watchlist entries
      responses:
        "200":
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistEntry"

    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add an asset to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWatchlistEntry"
      responses:
        "201":
          description: Created watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"

  /watchlist/{id}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove an asset from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: Get all alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlert"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /agent/chat:
    post:
      operationId: agentChat
      tags: [agent]
      summary: Send a command to the DST agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReply"

  /signals/feed:
    get:
      operationId: getSignalFeed
      tags: [signals]
      summary: Get chronological signal feed for all assets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Signal feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalFeedEntry"

  /integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: Get status of all integration scaffolds
      responses:
        "200":
          description: List of integration statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}/toggle:
    post:
      operationId: toggleIntegration
      tags: [integrations]
      summary: Enable or disable an integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /integrations/{name}:
    get:
      operationId: getIntegrationByName
      tags: [integrations]
      summary: Get status of a specific integration
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /hermes/status:
    get:
      operationId: getHermesStatus
      tags: [hermes]
      summary: Get current Hermes scan loop status and job queue
      responses:
        "200":
          description: Hermes status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesScanStatus"

  /hermes/constraints:
    get:
      operationId: getHermesConstraints
      tags: [hermes]
      summary: Get current Hermes system constraints
      responses:
        "200":
          description: Current constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesConstraints"
    put:
      operationId: updateHermesConstraints
      tags: [hermes]
      summary: Update Hermes system constraints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesConstraintsUpdate"
      responses:
        "200":
          description: Updated constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesConstraints"

  /hermes/metrics:
    get:
      operationId: getHermesMetrics
      tags: [hermes]
      summary: Get stage accuracy and evaluation metrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [24H, 7D, 30D]
            default: 7D
      responses:
        "200":
          description: Hermes metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesMetrics"

  /hermes/scan:
    post:
      operationId: triggerHermesScan
      tags: [hermes]
      summary: Trigger a manual Hermes scan for all tracked assets
      responses:
        "200":
          description: Scan job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesScanResult"

  /hermes/evaluation:
    get:
      operationId: getHermesEvaluation
      tags: [hermes]
      summary: Get weekly evaluation report for threshold and rule review
      responses:
        "200":
          description: Evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HermesEvaluation"

  /hermes/jobs:
    get:
      operationId: getHermesJobs
      tags: [hermes]
      summary: Get recent Hermes job runs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HermesJob"

  /pyth/prices:
    get:
      operationId: getPythPrices
      tags: [pyth]
      summary: Get Pyth Network live price and confidence for all tracked assets
      responses:
        "200":
          description: Pyth price data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PythPriceData"

  /pyth/prices/{asset}:
    get:
      operationId: getPythPriceByAsset
      tags: [pyth]
      summary: Get Pyth price and confidence for a specific asset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pyth price data for asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PythPriceData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Signal:
      type: object
      description: >
        A disciplined pre-trade process report. Every signal includes a full
        pre-trade checklist, process verdict, logic admissibility, and explicit
        reject conditions. WAIT is the default when any required field is missing.
      properties:
        id:
          type: integer
        asset:
          type: string
        timeframe:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT, WAIT]
          description: Raw directional signal from the market structure analysis
        confidence:
          type: number
          description: Confidence score 0-100
        verdictDjzs:
          type: string
          enum: [PASS, FAIL, WAIT]
          description: DJZS logic admissibility audit verdict
        processVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
          description: >
            Pre-trade process verdict. APPROVED = all checklist items present and
            valid. REJECTED = one or more hard rules violated. DEGRADED = setup
            is valid but penalized (late entry, narrative risk, etc.).
        logicAdmissibility:
          type: string
          enum: [ADMISSIBLE, INADMISSIBLE, CONDITIONAL]
          description: >
            Whether the signal passes structural logic rules. Separate from
            market direction and from the DJZS audit verdict.
        setupFamily:
          type: string
          enum: [TREND_CONTINUATION_LONG, TREND_CONTINUATION_SHORT, RANGE_LONG, RANGE_SHORT, NO_SETUP]
          description: Classified setup type. Trend continuation is the primary family.
        entryQuality:
          type: string
          enum: [OPTIMAL, ACCEPTABLE, LATE, INVALID]
          description: Quality grade for the entry timing based on ATR extension and structure.
        narrativeRisk:
          type: string
          enum: [LOW, MEDIUM, HIGH]
          description: >
            Risk that the setup is driven by narrative rather than structure.
            HIGH narrative risk penalizes or rejects the setup.
        rrRatio:
          type: number
          description: Reward-to-risk ratio. Signals with rrRatio < 1.5 are rejected.
        thesis:
          type: string
          description: One-sentence pre-trade thesis for this setup.
        whyTrade:
          type: string
          description: >
            Concise explanation of why this is or is not an actionable trade.
            Always present, even for WAIT signals.
        rejectIf:
          type: array
          items:
            type: string
          description: >
            Explicit conditions that would invalidate this signal if triggered.
            e.g. "Price closes below EMA50", "OI drops > 15% in 4H".
        rejectionCodes:
          type: array
          items:
            type: string
          description: >
            Machine-readable codes for why the setup was rejected or degraded.
            Signal logic codes: NO_REGIME, ENTRY_TOO_LATE, STOP_INVALID,
            TARGET_UNREALISTIC, NARRATIVE_HEAVY, CONFLICTING_SIGNALS,
            CROWDING_TOO_HIGH, NO_INVALIDATION, RR_BELOW_THRESHOLD,
            CONFIDENCE_STRUCTURE_MISMATCH, UNDEFINED_REGIME, RANGE_SECONDARY.
            Data-quality codes: DATA_UNAVAILABLE (price missing or zero — hard
            WAIT), STALE_PRICE (DefiLlama timestamp older than 5 minutes —
            degrades signal), INSUFFICIENT_HISTORY (fewer than 50 4H bars —
            indicators unreliable), FALLBACK_PRICE_USED (fetch failed, zero
            used as fallback — hard WAIT).
        processQualityGrade:
          type: string
          enum: [A, B, C, D, F]
          description: >
            Overall process quality grade. Reflects discipline of the setup
            independent of market outcome.
        entryZoneLow:
          type: number
        entryZoneHigh:
          type: number
        targetZone:
          type: number
        invalidationPrice:
          type: number
        reasonCodes:
          type: array
          items:
            type: string
          description: Positive signal reason codes
        computedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - timeframe
        - direction
        - confidence
        - verdictDjzs
        - processVerdict
        - logicAdmissibility
        - setupFamily
        - entryQuality
        - narrativeRisk
        - rrRatio
        - thesis
        - whyTrade
        - rejectIf
        - rejectionCodes
        - processQualityGrade
        - reasonCodes
        - computedAt

    SignalDetail:
      allOf:
        - $ref: "#/components/schemas/Signal"
        - type: object
          properties:
            marketSnapshot:
              $ref: "#/components/schemas/MarketSnapshot"
            trendRegime:
              $ref: "#/components/schemas/TrendRegime"
            openInterestContext:
              $ref: "#/components/schemas/OIContext"
            auditReport:
              $ref: "#/components/schemas/AuditReport"
            preTradChecklist:
              $ref: "#/components/schemas/PreTradeChecklist"
            outcomeTracking:
              $ref: "#/components/schemas/OutcomeTracking"
            dataQuality:
              $ref: "#/components/schemas/DataQualityReport"
              description: >
                Data provenance and quality report for this signal. Surfaces
                source hierarchy, freshness, quality flags, and the Pyth
                secondary verifier result. Degrade or WAIT signals appear here
                when data quality falls below threshold.

    PreTradeChecklist:
      type: object
      description: >
        Structured pre-trade checklist that must be complete before a signal
        can be APPROVED. Missing required fields force a WAIT output.
      properties:
        thesis:
          type: string
        regimeConfirmed:
          type: boolean
        entryZoneDefined:
          type: boolean
        invalidationDefined:
          type: boolean
        targetDefined:
          type: boolean
        reasonCodesPresent:
          type: boolean
        rejectConditionsDefined:
          type: boolean
        rrRatioAcceptable:
          type: boolean
        checklistComplete:
          type: boolean
        missingFields:
          type: array
          items:
            type: string
      required:
        - thesis
        - regimeConfirmed
        - entryZoneDefined
        - invalidationDefined
        - targetDefined
        - reasonCodesPresent
        - rejectConditionsDefined
        - rrRatioAcceptable
        - checklistComplete
        - missingFields

    OutcomeTracking:
      type: object
      description: >
        Scaffolded outcome tracking for process-vs-outcome separation.
        All fields null until outcome tracking is enabled in a future phase.
      properties:
        scaffolded:
          type: boolean
          description: Always true — outcome tracking is not yet live
        entryFilled:
          type: boolean
          nullable: true
        exitPrice:
          type: number
          nullable: true
        pnlPct:
          type: number
          nullable: true
        outcome:
          type: string
          enum: [WIN, LOSS, BREAKEVEN, OPEN, PENDING]
          nullable: true
        processScore:
          type: number
          nullable: true
          description: Process quality score independent of outcome
      required:
        - scaffolded

    MarketSnapshot:
      type: object
      properties:
        asset:
          type: string
        price:
          type: number
        priceChange24h:
          type: number
        priceChangePct24h:
          type: number
        volume24h:
          type: number
        marketCap:
          type: number
        totalValueLocked:
          type: number
        defiLlamaSlug:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - asset
        - price
        - priceChange24h
        - priceChangePct24h
        - updatedAt

    TrendRegime:
      type: object
      properties:
        asset:
          type: string
        regime:
          type: string
          enum: [BULL, BEAR, RANGING, UNDEFINED]
        ema9:
          type: number
        ema21:
          type: number
        ema50:
          type: number
        rsi:
          type: number
        macdHistogram:
          type: number
        atr:
          type: number
        trendStrength:
          type: number
          description: 0-100
      required:
        - asset
        - regime

    OIContext:
      type: object
      properties:
        asset:
          type: string
        openInterest:
          type: number
        oiChange24h:
          type: number
        oiChangePct24h:
          type: number
        fundingRate:
          type: number
        longShortRatio:
          type: number
        dominantSide:
          type: string
          enum: [LONG, SHORT, NEUTRAL]
      required:
        - asset
        - dominantSide

    AuditReport:
      type: object
      properties:
        asset:
          type: string
        verdict:
          type: string
          enum: [PASS, FAIL, WAIT]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AuditCheck"
        summary:
          type: string
        generatedAt:
          type: string
          format: date-time
      required:
        - asset
        - verdict
        - checks
        - summary
        - generatedAt

    AuditCheck:
      type: object
      properties:
        name:
          type: string
        result:
          type: string
          enum: [PASS, FAIL, WARN, SKIP]
        detail:
          type: string
        weight:
          type: number
      required:
        - name
        - result
        - detail
        - weight

    WatchlistEntry:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        timeframe:
          type: string
        addedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - timeframe
        - addedAt

    CreateWatchlistEntry:
      type: object
      properties:
        asset:
          type: string
        timeframe:
          type: string
          enum: [1H, 4H, 1D]
          default: 4H
      required:
        - asset

    Alert:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        condition:
          type: string
          enum: [LONG_SIGNAL, SHORT_SIGNAL, PRICE_ABOVE, PRICE_BELOW, DJZS_PASS, PROCESS_APPROVED]
        threshold:
          type: number
        active:
          type: boolean
        triggeredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - condition
        - active
        - createdAt

    CreateAlert:
      type: object
      properties:
        asset:
          type: string
        condition:
          type: string
          enum: [LONG_SIGNAL, SHORT_SIGNAL, PRICE_ABOVE, PRICE_BELOW, DJZS_PASS, PROCESS_APPROVED]
        threshold:
          type: number
      required:
        - asset
        - condition

    AgentChatRequest:
      type: object
      properties:
        message:
          type: string
        sessionId:
          type: string
      required:
        - message

    AgentReply:
      type: object
      properties:
        reply:
          type: string
        command:
          type: string
        data:
          type: object
          additionalProperties: true
        sessionId:
          type: string
      required:
        - reply
        - sessionId

    SignalFeedEntry:
      type: object
      properties:
        id:
          type: integer
        asset:
          type: string
        direction:
          type: string
          enum: [LONG, SHORT, WAIT]
        verdict:
          type: string
          enum: [PASS, FAIL, WAIT]
        processVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
        setupFamily:
          type: string
          enum: [TREND_CONTINUATION_LONG, TREND_CONTINUATION_SHORT, RANGE_LONG, RANGE_SHORT, NO_SETUP]
        confidence:
          type: number
        rrRatio:
          type: number
        summary:
          type: string
        computedAt:
          type: string
          format: date-time
      required:
        - id
        - asset
        - direction
        - verdict
        - processVerdict
        - setupFamily
        - confidence
        - rrRatio
        - summary
        - computedAt

    IntegrationStatus:
      type: object
      description: >
        Scaffold entry for a planned system integration.
        All integrations are off by default until configured and enabled.
      properties:
        name:
          type: string
          description: Machine-readable integration name
        displayName:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [SCHEDULER, PRICE_FEED, RESEARCH, ALERTS, ENRICHMENT]
        enabled:
          type: boolean
        configured:
          type: boolean
          description: Whether required env vars / credentials are present
        status:
          type: string
          enum: [ACTIVE, DISABLED, NOT_CONFIGURED, COMING_SOON]
        envKeyRequired:
          type: string
          nullable: true
          description: Name of the required environment variable
        docsUrl:
          type: string
          nullable: true
        phase:
          type: string
          description: Which expansion phase this integration belongs to (e.g. "Phase 2")
      required:
        - name
        - displayName
        - description
        - category
        - enabled
        - configured
        - status
        - phase

    HermesConstraints:
      type: object
      description: >
        Durable system constraints managed by Hermes. These are enforced on every
        scan and are the authoritative source of signal policy. Not opinions — constraints.
      properties:
        preferredAssets:
          type: array
          items:
            type: string
          description: Assets to scan in order of priority (e.g. ["BTC", "ETH", "SOL"])
        activeTimeframe:
          type: string
          enum: [1H, 4H, 1D]
          description: Active timeframe for all scans
        minRRThreshold:
          type: number
          description: Minimum reward/risk ratio required for APPROVED. Default 1.5.
        lateEntryAtrMultiplier:
          type: number
          description: ATR multiplier for late-entry detection. Default 1.5.
        oneSignalPerAsset:
          type: boolean
          description: Enforce only one active APPROVED signal per asset/timeframe
        browserbaseTriggerPolicy:
          type: string
          enum: [DISABLED, HIGH_CONFIDENCE, APPROVED_ONLY]
          description: When to trigger Browserbase web research
        pythConfidenceFilter:
          type: boolean
          description: Whether to use Pyth confidence score in processVerdict calculation
        pythConfidenceThreshold:
          type: number
          description: Minimum Pyth confidence ratio (0-1) to allow APPROVED. Default 0.95.
        alertRouting:
          type: object
          properties:
            telegram:
              type: boolean
            xmtp:
              type: boolean
            discord:
              type: boolean
          required: [telegram, xmtp, discord]
        waitBiasPolicy:
          type: string
          enum: [STRICT, STANDARD, RELAXED]
          description: >
            Overall WAIT bias. STRICT = most scans end in WAIT (default).
            STANDARD = moderate filter. RELAXED = fewer filters.
        updatedAt:
          type: string
          format: date-time
      required:
        - preferredAssets
        - activeTimeframe
        - minRRThreshold
        - lateEntryAtrMultiplier
        - oneSignalPerAsset
        - browserbaseTriggerPolicy
        - pythConfidenceFilter
        - pythConfidenceThreshold
        - alertRouting
        - waitBiasPolicy
        - updatedAt

    HermesConstraintsUpdate:
      type: object
      description: Partial update to Hermes constraints. Only provided fields are updated.
      properties:
        preferredAssets:
          type: array
          items:
            type: string
        activeTimeframe:
          type: string
          enum: [1H, 4H, 1D]
        minRRThreshold:
          type: number
        lateEntryAtrMultiplier:
          type: number
        oneSignalPerAsset:
          type: boolean
        browserbaseTriggerPolicy:
          type: string
          enum: [DISABLED, HIGH_CONFIDENCE, APPROVED_ONLY]
        pythConfidenceFilter:
          type: boolean
        pythConfidenceThreshold:
          type: number
        alertRouting:
          type: object
          properties:
            telegram:
              type: boolean
            xmtp:
              type: boolean
            discord:
              type: boolean
        waitBiasPolicy:
          type: string
          enum: [STRICT, STANDARD, RELAXED]

    HermesScanStatus:
      type: object
      description: >
        Current state of the Hermes scan loop. The 15-minute scan loop is scaffolded
        and will be activated when the Hermes Scheduler integration is enabled.
      properties:
        running:
          type: boolean
        schedulerActive:
          type: boolean
          description: Whether the Hermes 15-minute interval scheduler is active
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        scanIntervalMinutes:
          type: integer
        totalScansToday:
          type: integer
        totalApprovedToday:
          type: integer
        totalWaitToday:
          type: integer
        activeJobs:
          type: array
          items:
            $ref: "#/components/schemas/HermesJob"
        recentJobs:
          type: array
          items:
            $ref: "#/components/schemas/HermesJob"
        phase:
          type: string
          description: Current phase label shown in the control center
      required:
        - running
        - schedulerActive
        - scanIntervalMinutes
        - totalScansToday
        - totalApprovedToday
        - totalWaitToday
        - activeJobs
        - recentJobs

    HermesJob:
      type: object
      description: A single Hermes scan job for one asset through the full pipeline
      properties:
        id:
          type: string
        asset:
          type: string
        scanStartedAt:
          type: string
          format: date-time
        scanCompletedAt:
          type: string
          format: date-time
          nullable: true
        phases:
          type: array
          items:
            $ref: "#/components/schemas/HermesJobPhase"
        finalDirection:
          type: string
          enum: [LONG, SHORT, WAIT]
          nullable: true
        finalProcessVerdict:
          type: string
          enum: [APPROVED, REJECTED, DEGRADED]
          nullable: true
        setupFamily:
          type: string
          nullable: true
        rejectionCodes:
          type: array
          items:
            type: string
        triggered:
          type: boolean
          description: Whether this job was triggered manually or by the scheduler
      required:
        - id
        - asset
        - scanStartedAt
        - phases
        - rejectionCodes
        - triggered

    HermesJobPhase:
      type: object
      description: One stage in a Hermes scan pipeline job
      properties:
        stage:
          type: string
          enum: [DEFILAMMA, PYTH, BROWSERBASE, DJZS_AUDIT, ROUTING]
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETE, SKIPPED, FAILED]
        skippedReason:
          type: string
          nullable: true
        durationMs:
          type: integer
          nullable: true
        result:
          type: string
          nullable: true
      required:
        - stage
        - status

    HermesScanResult:
      type: object
      description: Result of a triggered Hermes scan
      properties:
        triggeredAt:
          type: string
          format: date-time
        assets:
          type: array
          items:
            type: string
        jobIds:
          type: array
          items:
            type: string
        message:
          type: string
      required:
        - triggeredAt
        - assets
        - jobIds
        - message

    HermesMetrics:
      type: object
      description: >
        Stage accuracy and evaluation metrics. Most rates are derived from the
        signals table. Outcome-dependent rates (candidateAccuracy, filterAccuracy,
        noTradeQuality) are null until outcome tracking is live in Phase 3.
      properties:
        period:
          type: string
          enum: [24H, 7D, 30D]
        totalScans:
          type: integer
        totalCandidates:
          type: integer
          description: Scans that produced a non-WAIT direction before DJZS audit
        totalApproved:
          type: integer
        totalDegraded:
          type: integer
        totalRejected:
          type: integer
        totalWait:
          type: integer
        waitRate:
          type: number
          description: Fraction of scans ending WAIT. Target > 0.70 in STRICT mode.
        approvalRate:
          type: number
        avgRROnApproved:
          type: number
          nullable: true
        avgConfidenceOnApproved:
          type: number
          nullable: true
        candidateAccuracy:
          type: number
          nullable: true
          description: Scaffolded — requires Phase 3 outcome tracking
        filterAccuracy:
          type: number
          nullable: true
          description: Scaffolded — fraction of REJECTED that would have lost if taken
        timingAccuracy:
          type: number
          nullable: true
          description: Fraction of APPROVED with OPTIMAL or ACCEPTABLE entry quality
        noTradeQuality:
          type: number
          nullable: true
          description: Scaffolded — fraction of WAITs that would have lost if taken
        researchLift:
          type: number
          nullable: true
          description: Scaffolded — improvement in accuracy when Browserbase was triggered
        alertUsefulness:
          type: number
          nullable: true
          description: Scaffolded — requires delivery + outcome data
        rejectionCodeBreakdown:
          type: object
          additionalProperties:
            type: integer
        setupFamilyBreakdown:
          type: object
          additionalProperties:
            type: integer
        pythInfluenceCount:
          type: integer
          description: Number of signals where Pyth confidence affected processVerdict
        computedAt:
          type: string
          format: date-time
      required:
        - period
        - totalScans
        - totalCandidates
        - totalApproved
        - totalDegraded
        - totalRejected
        - totalWait
        - waitRate
        - approvalRate
        - rejectionCodeBreakdown
        - setupFamilyBreakdown
        - pythInfluenceCount
        - computedAt

    HermesEvaluation:
      type: object
      description: >
        Weekly evaluation report reviewing thresholds, reject conditions, trigger rules,
        and routing rules. Does not change core doctrine — only surfaces what to review.
      properties:
        generatedAt:
          type: string
          format: date-time
        periodLabel:
          type: string
        thresholdReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        rejectConditionReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        triggerRuleReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        routingRuleReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        overallAssessment:
          type: string
        doctrineStatus:
          type: string
          description: Always "INTACT" — DJZS doctrine is never modified by evaluation
      required:
        - generatedAt
        - periodLabel
        - thresholdReview
        - rejectConditionReview
        - triggerRuleReview
        - routingRuleReview
        - overallAssessment
        - doctrineStatus

    EvalReviewItem:
      type: object
      properties:
        parameter:
          type: string
        currentValue:
          type: string
        observation:
          type: string
        recommendation:
          type: string
          enum: [KEEP, TIGHTEN, LOOSEN, REVIEW]
        rationale:
          type: string
      required:
        - parameter
        - currentValue
        - observation
        - recommendation
        - rationale

    PythPriceData:
      type: object
      description: >
        Live price and confidence data from the Pyth Network Hermes REST API.
        Confidence reflects the price band around the reported price. A confidence
        ratio (confidence/price) below the threshold in HermesConstraints degrades
        or blocks APPROVED verdicts when pythConfidenceFilter is enabled.
      properties:
        asset:
          type: string
        pythId:
          type: string
          description: Pyth price feed ID (hex)
        price:
          type: number
        confidence:
          type: number
          description: Absolute confidence interval (±USD)
        confidenceRatio:
          type: number
          description: confidence / price — lower is better
        confidenceStatus:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: HIGH = ratio < 0.001, MEDIUM = < 0.01, LOW = >= 0.01
        emaPrice:
          type: number
          description: Exponential moving average price from Pyth
        emaConfidence:
          type: number
        publishTime:
          type: string
          format: date-time
        slotAge:
          type: integer
          description: Slots since last update (freshness indicator)
        fresh:
          type: boolean
          description: Whether the price is fresh (slotAge < 10)
        influencesProcessVerdict:
          type: boolean
          description: Whether this data is currently affecting processVerdict
      required:
        - asset
        - pythId
        - price
        - confidence
        - confidenceRatio
        - confidenceStatus
        - emaPrice
        - emaConfidence
        - publishTime
        - slotAge
        - fresh
        - influencesProcessVerdict

    DataProvenance:
      type: object
      description: >
        Provenance metadata for a single fetched data field. Records where
        data came from, when it was fetched, how old the underlying data is,
        and whether it is considered stale or a fallback value.
      properties:
        source:
          type: string
          enum:
            - DEFILLAMA_COINS
            - DEFILLAMA_DERIVATIVES
            - DEFILLAMA_TVL
            - PYTH_HERMES
            - SYNTHETIC
            - DERIVED
            - FALLBACK_ZERO
            - FALLBACK_ESTIMATED
          description: The authoritative data source for this field.
        fetchedAt:
          type: string
          format: date-time
          description: When the HTTP request was made.
        dataTimestamp:
          type: string
          format: date-time
          nullable: true
          description: The timestamp embedded in the API response (not our fetch time).
        ageMs:
          type: integer
          description: Age of the data in milliseconds at fetch time.
        isStale:
          type: boolean
          description: Whether ageMs exceeds the field's stale threshold.
        isFallback:
          type: boolean
          description: Whether a fallback value was substituted because the real fetch failed.
        stallThresholdMs:
          type: integer
          description: The threshold used to determine staleness (ms).
      required:
        - source
        - fetchedAt
        - ageMs
        - isStale
        - isFallback
        - stallThresholdMs

    PythVerifierResult:
      type: object
      description: >
        Scaffolded secondary price-confidence verifier using the Pyth Hermes
        REST API. When the Pyth confidence filter is enabled in HermesConstraints,
        this runs on every signal and compares the Pyth spot price against the
        DefiLlama price. A divergence above 0.5% sets verdict to DIVERGES and
        adds a quality flag. Confidence ratio below threshold degrades the
        processVerdict. This is architecturally ready for full integration in the
        next hardening phase.
      properties:
        scaffolded:
          type: boolean
          description: Always true — indicates this is a scaffolded integration
        checked:
          type: boolean
          description: Whether a Pyth fetch was actually attempted this cycle
        pythPrice:
          type: number
          nullable: true
        defillamaPrice:
          type: number
          nullable: true
        priceDivergencePct:
          type: number
          nullable: true
          description: Absolute percentage divergence between Pyth and DefiLlama prices
        confidenceRatio:
          type: number
          nullable: true
          description: Pyth confidence / price — lower is tighter
        confidenceStatus:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          nullable: true
        fresh:
          type: boolean
          nullable: true
        verdict:
          type: string
          enum: [CONFIRMS, DIVERGES, UNAVAILABLE, SKIPPED]
          description: >
            CONFIRMS = prices within 0.5% and data fresh.
            DIVERGES = prices differ by more than 0.5%.
            UNAVAILABLE = Pyth fetch failed or data stale.
            SKIPPED = Pyth confidence filter disabled in constraints.
        verdictDetail:
          type: string
          description: Human-readable explanation of the verdict.
        influencesProcessVerdict:
          type: boolean
          description: Whether this result is currently affecting processVerdict.
      required:
        - scaffolded
        - checked
        - verdict
        - verdictDetail
        - influencesProcessVerdict

    DataQualityReport:
      type: object
      description: >
        Canonical data quality and provenance report for a computed signal.
        Summarises where all input data came from, how fresh it is, what quality
        flags were raised, and whether the data meets the minimum quality bar
        for a reliable signal. Signals with CRITICAL grade are forced to WAIT.
        Signals with POOR grade have degraded confidence.
      properties:
        grade:
          type: string
          enum: [GOOD, DEGRADED, POOR, CRITICAL]
          description: >
            Overall data quality grade derived from the worst flags present.
            CRITICAL = missing or unavailable price data — forces WAIT.
            POOR = stale price, fallback used, or insufficient history.
            DEGRADED = conflicting prices, Pyth divergence, or low confidence.
            GOOD = all inputs fresh and verified.
        flags:
          type: array
          items:
            type: string
            enum:
              - STALE_PRICE
              - STALE_HISTORY
              - MISSING_PRICE
              - MISSING_HISTORY
              - INSUFFICIENT_HISTORY
              - FALLBACK_PRICE_USED
              - SYNTHETIC_OI
              - SYNTHETIC_FUNDING
              - LOW_CONFIDENCE
              - CONFLICTING_PRICES
              - PYTH_DIVERGENCE
              - PYTH_UNAVAILABLE
              - TVL_MISSING
              - VOLUME_MISSING
              - DATA_UNAVAILABLE
          description: All quality flags raised during this signal computation.
        priceProvenance:
          $ref: "#/components/schemas/DataProvenance"
        historyProvenance:
          $ref: "#/components/schemas/DataProvenance"
        oiProvenance:
          $ref: "#/components/schemas/DataProvenance"
        tvlProvenance:
          $ref: "#/components/schemas/DataProvenance"
          nullable: true
        pythVerifier:
          $ref: "#/components/schemas/PythVerifierResult"
        historicalBarCount:
          type: integer
          description: Number of 4H bars available for indicator computation.
        minHistoricalBarsRequired:
          type: integer
          description: Minimum bars required for reliable indicators (currently 50).
        dataReadyForSignal:
          type: boolean
          description: >
            True if data quality meets the minimum bar for a valid signal.
            False if the signal was computed on insufficient or missing data.
        degradedConfidence:
          type: boolean
          description: Whether confidence score was reduced due to data quality issues.
        forcedWaitReason:
          type: string
          nullable: true
          description: >
            If data quality forced a WAIT outcome, this string explains why.
            Null when the signal was not forced to WAIT by data quality.
        computedAt:
          type: string
          format: date-time
      required:
        - grade
        - flags
        - priceProvenance
        - historyProvenance
        - oiProvenance
        - pythVerifier
        - historicalBarCount
        - minHistoricalBarsRequired
        - dataReadyForSignal
        - degradedConfidence
        - computedAt
