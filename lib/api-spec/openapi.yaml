          enum: [1H, 4H, 1D]
        minRRThreshold:
          type: number
        lateEntryAtrMultiplier:
          type: number
        oneSignalPerAsset:
          type: boolean
        browserbaseTriggerPolicy:
          type: string
          enum: [DISABLED, HIGH_CONFIDENCE, APPROVED_ONLY]
        pythConfidenceFilter:
          type: boolean
        pythConfidenceThreshold:
          type: number
        alertRouting:
          type: object
          properties:
            telegram:
              type: boolean
            xmtp:
              type: boolean
            discord:
              type: boolean
        waitBiasPolicy:
          type: string
          enum: [STRICT, STANDARD, RELAXED]

