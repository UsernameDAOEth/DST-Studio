        rejectConditionReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        triggerRuleReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        routingRuleReview:
          type: array
          items:
            $ref: "#/components/schemas/EvalReviewItem"
        overallAssessment:
          type: string
        doctrineStatus:
          type: string
          description: Always "INTACT" — DJZS doctrine is never modified by evaluation
      required:
        - generatedAt
        - periodLabel
        - thresholdReview
        - rejectConditionReview
        - triggerRuleReview
        - routingRuleReview
        - overallAssessment
        - doctrineStatus

    EvalReviewItem:
      type: object
      properties:
        parameter:
          type: string
        currentValue:
          type: string
        observation:
          type: string
        recommendation:
          type: string
          enum: [KEEP, TIGHTEN, LOOSEN, REVIEW]
        rationale:
          type: string
      required:
        - parameter
        - currentValue
        - observation
        - recommendation
        - rationale

    PythPriceData:
      type: object
      description: >
        Live price and confidence data from the Pyth Network Hermes REST API.
        Confidence reflects the price band around the reported price. A confidence
        ratio (confidence/price) below the threshold in HermesConstraints degrades
        or blocks APPROVED verdicts when pythConfidenceFilter is enabled.
      properties:
        asset:
          type: string
        pythId:
          type: string
          description: Pyth price feed ID (hex)
        price:
          type: number
        confidence:
          type: number
          description: Absolute confidence interval (±USD)
        confidenceRatio:
          type: number
          description: confidence / price — lower is better
        confidenceStatus:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          description: HIGH = ratio < 0.001, MEDIUM = < 0.01, LOW = >= 0.01
        emaPrice:
          type: number
          description: Exponential moving average price from Pyth
        emaConfidence:
          type: number
        publishTime:
          type: string
          format: date-time
        slotAge:
          type: integer
          description: Slots since last update (freshness indicator)
        fresh:
          type: boolean
          description: Whether the price is fresh (slotAge < 10)
        influencesProcessVerdict:
          type: boolean
          description: Whether this data is currently affecting processVerdict
      required:
        - asset
        - pythId
        - price
        - confidence
        - confidenceRatio
        - confidenceStatus
        - emaPrice
        - emaConfidence
        - publishTime
        - slotAge
        - fresh
        - influencesProcessVerdict

    DataProvenance:
      type: object
      description: >
        Provenance metadata for a single fetched data field. Records where
        data came from, when it was fetched, how old the underlying data is,
        and whether it is considered stale or a fallback value.
      properties:
        source:
          type: string
          enum:
            - DEFILLAMA_COINS
            - DEFILLAMA_DERIVATIVES
            - DEFILLAMA_TVL
            - PYTH_HERMES
            - SYNTHETIC
            - DERIVED
            - FALLBACK_ZERO
            - FALLBACK_ESTIMATED
          description: The authoritative data source for this field.
        fetchedAt:
          type: string
          format: date-time
          description: When the HTTP request was made.
        dataTimestamp:
          type: string
          format: date-time
          nullable: true
          description: The timestamp embedded in the API response (not our fetch time).
        ageMs:
          type: integer
          description: Age of the data in milliseconds at fetch time.
        isStale:
          type: boolean
          description: Whether ageMs exceeds the field's stale threshold.
        isFallback:
          type: boolean
          description: Whether a fallback value was substituted because the real fetch failed.
        stallThresholdMs:
          type: integer
          description: The threshold used to determine staleness (ms).
      required:
        - source
        - fetchedAt
        - ageMs
        - isStale
        - isFallback
        - stallThresholdMs

    PythVerifierResult:
      type: object
      description: >
        Scaffolded secondary price-confidence verifier using the Pyth Hermes
        REST API. When the Pyth confidence filter is enabled in HermesConstraints,
        this runs on every signal and compares the Pyth spot price against the
        DefiLlama price. A divergence above 0.5% sets verdict to DIVERGES and
        adds a quality flag. Confidence ratio below threshold degrades the
        processVerdict. This is architecturally ready for full integration in the
        next hardening phase.
      properties:
        scaffolded:
          type: boolean
          description: Always true — indicates this is a scaffolded integration
        checked:
          type: boolean
          description: Whether a Pyth fetch was actually attempted this cycle
        pythPrice:
          type: number
          nullable: true
        defillamaPrice:
          type: number
          nullable: true
        priceDivergencePct:
          type: number
          nullable: true
          description: Absolute percentage divergence between Pyth and DefiLlama prices
        confidenceRatio:
          type: number
          nullable: true
          description: Pyth confidence / price — lower is tighter
        confidenceStatus:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          nullable: true
        fresh:
          type: boolean
          nullable: true
        verdict:
          type: string
          enum: [CONFIRMS, DIVERGES, UNAVAILABLE, SKIPPED]
          description: >
            CONFIRMS = prices within 0.5% and data fresh.
            DIVERGES = prices differ by more than 0.5%.
            UNAVAILABLE = Pyth fetch failed or data stale.
            SKIPPED = Pyth confidence filter disabled in constraints.
        verdictDetail:
          type: string
          description: Human-readable explanation of the verdict.
        influencesProcessVerdict:
          type: boolean
          description: Whether this result is currently affecting processVerdict.
      required:
        - scaffolded
        - checked
        - verdict
        - verdictDetail
        - influencesProcessVerdict

    DataQualityReport:
      type: object
      description: >
        Canonical data quality and provenance report for a computed signal.
        Summarises where all input data came from, how fresh it is, what quality
        flags were raised, and whether the data meets the minimum quality bar
        for a reliable signal. Signals with CRITICAL grade are forced to WAIT.
        Signals with POOR grade have degraded confidence.
      properties:
        grade:
          type: string
          enum: [GOOD, DEGRADED, POOR, CRITICAL]
          description: >
            Overall data quality grade derived from the worst flags present.
            CRITICAL = missing or unavailable price data — forces WAIT.
            POOR = stale price, fallback used, or insufficient history.
            DEGRADED = conflicting prices, Pyth divergence, or low confidence.
            GOOD = all inputs fresh and verified.
        flags:
          type: array
          items:
            type: string
            enum:
              - STALE_PRICE
              - STALE_HISTORY
              - MISSING_PRICE
              - MISSING_HISTORY
              - INSUFFICIENT_HISTORY
              - FALLBACK_PRICE_USED
              - SYNTHETIC_OI
              - SYNTHETIC_FUNDING
              - LOW_CONFIDENCE
              - CONFLICTING_PRICES
              - PYTH_DIVERGENCE
              - PYTH_UNAVAILABLE
              - TVL_MISSING
              - VOLUME_MISSING
              - DATA_UNAVAILABLE
          description: All quality flags raised during this signal computation.
        priceProvenance:
          $ref: "#/components/schemas/DataProvenance"
        historyProvenance:
          $ref: "#/components/schemas/DataProvenance"
        oiProvenance:
          $ref: "#/components/schemas/DataProvenance"
        tvlProvenance:
          $ref: "#/components/schemas/DataProvenance"
          nullable: true
        pythVerifier:
          $ref: "#/components/schemas/PythVerifierResult"
        historicalBarCount:
          type: integer
          description: Number of 4H bars available for indicator computation.
        minHistoricalBarsRequired:
          type: integer
          description: Minimum bars required for reliable indicators (currently 50).
        dataReadyForSignal:
          type: boolean
          description: >
            True if data quality meets the minimum bar for a valid signal.
            False if the signal was computed on insufficient or missing data.
        degradedConfidence:
          type: boolean
          description: Whether confidence score was reduced due to data quality issues.
        forcedWaitReason:
          type: string
          nullable: true
          description: >
            If data quality forced a WAIT outcome, this string explains why.
            Null when the signal was not forced to WAIT by data quality.
        computedAt:
          type: string
          format: date-time
      required:
        - grade
        - flags
        - priceProvenance
        - historyProvenance
        - oiProvenance
        - pythVerifier
        - historicalBarCount
        - minHistoricalBarsRequired
        - dataReadyForSignal
        - degradedConfidence
        - computedAt

    AgentFindingEvidence:
      type: object
      description: A single source-aware evidence item attached to a Hermes finding.
      properties:
        source:
          type: string
          description: Human-readable source name (e.g. "DefiLlama", "on-chain tx")
        url:
          type: string
          description: Optional URL to the source
        excerpt:
          type: string
          description: Brief excerpt or observation text (max 500 chars)
        timestamp:
          type: string
          format: date-time
          description: When this evidence was observed (not when the finding was submitted)
        reliability:
          type: string
          enum: [VERIFIED, UNVERIFIED, CONFLICTING, STALE]
          description: >
            VERIFIED = confirmed from authoritative source.
            UNVERIFIED = not yet confirmed.
            CONFLICTING = contradicts other evidence.
            STALE = evidence is older than the expected freshness window.
      required:
        - source
        - reliability

    AgentFinding:
      type: object
      description: >
        A normalized Hermes agent finding. Hermes observes markets, protocols,
        wallets, news, funding, open interest, liquidations, and thesis-relevant
        events. Hermes does NOT approve trades, reject trades, execute trades,
        produce final scores or verdicts, or override DJZS. Confidence is
        metadata only. Suggested flags are hints — not decisions. If evidence
        is weak, incomplete, stale, or conflicting, that is explicitly surfaced.
      properties:
        findingId:
          type: string
        runId:
          type: string
          nullable: true
          description: Groups findings from the same agent run
        sourceAgent:
          type: string
          description: Identifier of the Hermes sub-agent that submitted this finding
        marketType:
          type: string
          enum: [PERP, SPOT, CROSS_MARKET, PROTOCOL]
        target:
          type: string
          description: Asset symbol this finding is about (e.g. ETH, BTC)
        observationType:
          type: string
          enum:
            - FUNDING_RATE
            - OPEN_INTEREST
            - LIQUIDATION_CLUSTER
            - THESIS_EVENT
            - NEWS
            - PROTOCOL_EVENT
            - PRICE_ACTION
            - WALLET_ACTIVITY
            - CUSTOM
        summary:
          type: string
          description: Plain observation text. What was observed — not conclusions.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentFindingEvidence"
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Metadata only — never used for scoring or verdict computation.
            Reflects Hermes certainty about the observation, not about trade direction.
        suggestedFlags:
          type: array
          items:
            type: string
          description: >
            Hint flags for analyst review (e.g. CROWDING_RISK, THESIS_RELEVANT).
            Hints only — not verdicts, not rejection codes. DJZS does not read these.
        status:
          type: string
          enum: [ACTIVE, EXPIRED, SUPERSEDED]
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - findingId
        - sourceAgent
        - marketType
        - target
        - observationType
        - summary
        - evidence
        - confidence
        - suggestedFlags
        - status
        - createdAt

    SubmitFindingRequest:
      type: object
      description: >
        Ingress payload for Hermes evidence submission. All fields are validated
        and normalized before storage. Confidence and suggested_flags are stored
        as metadata only and never influence DJZS verdicts.
      properties:
        finding_id:
          type: string
          description: Optional client-supplied ID. A UUID is generated if omitted.
        run_id:
          type: string
          description: Optional run identifier to group findings from the same agent session
        source_agent:
          type: string
          description: Identifier of the Hermes sub-agent submitting this finding
        market_type:
          type: string
          enum: [PERP, SPOT, CROSS_MARKET, PROTOCOL]
          default: PERP
        target:
          type: string
          description: Asset symbol — normalized to uppercase on ingestion
        observation_type:
          type: string
          enum:
            - FUNDING_RATE
            - OPEN_INTEREST
            - LIQUIDATION_CLUSTER
            - THESIS_EVENT
            - NEWS
            - PROTOCOL_EVENT
            - PRICE_ACTION
            - WALLET_ACTIVITY
            - CUSTOM
        summary:
          type: string
          description: Plain observation. What was seen — not what it means. Max 500 chars.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/AgentFindingEvidence"
          default: []
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Metadata only. Not used for scoring.
        suggested_flags:
          type: array
          items:
            type: string
          default: []
          description: Hint flags for analyst review. Not verdicts.
        expires_at:
          type: string
          format: date-time
          description: Optional expiry. Finding becomes INACTIVE after this time.
      required:
        - source_agent
        - target
        - observation_type
        - summary
        - confidence

    SubmitFindingAccepted:
      type: object
      description: Response confirming a Hermes finding was accepted and stored.
      properties:
        accepted:
          type: boolean
        findingId:
          type: string
        target:
          type: string
        boundaryReminder:
          type: string
          description: >
            Always included in the response to reinforce the Hermes boundary.
            Hermes submits findings only. Confidence is metadata. DJZS is the audit gate.
        createdAt:
          type: string
          format: date-time
      required:
        - accepted
        - findingId
        - target
        - boundaryReminder
        - createdAt

    VerificationCheck:
      type: object
      description: >
        Per-check result from the fast-path verification tier. Each check
        exposes its code, pass/fail/warn/skip status, a human-readable detail
        string, the source dependency it reads from, whether it is a hard fail
        (which short-circuits verification), and an optional failure mode code.
      properties:
        code:
          type: string
          enum:
            - PRICE_NOT_ZERO
            - MARKET_DATA_FRESH
            - HISTORY_SUFFICIENT
            - REGIME_EXISTS
            - INVALIDATION_EXISTS
            - RR_THRESHOLD
            - ENTRY_NOT_LATE
            - SIGNAL_REGIME_ALIGNED
            - SOURCES_CONSISTENT
            - PYTH_CONFIRMS
        status:
          type: string
          enum: [PASS, FAIL, WARN, SKIP]
        detail:
          type: string
        sourceDependency:
          type: string
          description: The data source this check reads from (e.g. DEFILLAMA_COINS, DERIVED, PYTH_HERMES).
        isHardFail:
          type: boolean
          description: True when this check failing causes immediate short-circuit to WAIT.
        failureModeCode:
          type: string
          nullable: true
          enum:
            - DETERMINISM_VIOLATION
            - INPUT_NORMALIZATION_ERROR
            - STALE_MARKET_STATE
            - MISSING_REQUIRED_FIELD
            - CONFLICTING_SOURCE_DATA
            - SEMANTIC_LAYER_UNAVAILABLE
            - FALLBACK_ONLY_MODE
      required: [code, status, detail, sourceDependency, isHardFail]

    VerificationReport:
      type: object
      description: >
        Full structured verification report for the normalized input packet.
        Runs before the DJZS audit. Exposes per-check results with failure-mode
        codes, degraded state, fallback-only mode, and whether the semantic layer
        is allowed. Hard failures short-circuit immediately. Hermes findings are
        EVIDENCE ONLY — they cannot drive or override any check in this report.
      properties:
        packetHash:
          type: string
          description: SHA-256 content hash (first 16 hex chars) of the canonical normalized packet.
        normalizationError:
          type: boolean
          description: True when input normalization encountered critical errors.
        fastPathPassed:
          type: boolean
          description: True when all hard-fail checks passed.
        shortCircuited:
          type: boolean
          description: True when a hard fail caused early exit before all checks ran.
        shortCircuitReason:
          type: string
          nullable: true
        checks:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCheck"
        failureCodes:
          type: array
          items:
            type: string
            enum:
              - DETERMINISM_VIOLATION
              - INPUT_NORMALIZATION_ERROR
              - STALE_MARKET_STATE
              - MISSING_REQUIRED_FIELD
              - CONFLICTING_SOURCE_DATA
              - SEMANTIC_LAYER_UNAVAILABLE
              - FALLBACK_ONLY_MODE
          description: Deduplicated failure mode codes from all failed/warned checks.
        degradedState:
          type: boolean
          description: True when any hard fail or soft warn is present.
        fallbackOnlyMode:
          type: boolean
          description: True when FALLBACK_ONLY_MODE failure code is present.
        semanticLayerAllowed:
          type: boolean
          description: >
            True when fast path passes entirely and no critical normalization
            error exists. Semantic or narrative checks are subordinate and only
            run when this is true.
        hermesEvidenceOnly:
          type: boolean
          description: >
            Always true. Enforces the boundary doctrine: Hermes findings are
            evidence context only. They cannot contribute to verification
            outcomes, scores, or verdicts.
        verifiedAt:
          type: string
          format: date-time
      required:
        - packetHash
        - normalizationError
        - fastPathPassed
        - shortCircuited
        - checks
        - failureCodes
        - degradedState
        - fallbackOnlyMode
        - semanticLayerAllowed
        - hermesEvidenceOnly
        - verifiedAt

    HermesFindingsContext:
      type: object
      description: >
        Hermes monitoring findings adapted as read-only audit context for a
        trade packet. Confidence values and suggested flags are surfaced as
        metadata only. DJZS verdict computation is not influenced by Hermes
        context in any way. This section surfaces what Hermes observed — not
        to score or override the audit result.
      properties:
        findingCount:
          type: integer
        activeFindings:
          type: array
          items:
            $ref: "#/components/schemas/AgentFinding"
        suggestedFlagHints:
          type: array
          items:
            type: string
          description: Deduplicated hint flags from all active findings. For analyst review only.
        boundaryReminder:
          type: string
        attachedAt:
          type: string
          format: date-time
      required:
        - findingCount
        - activeFindings
        - suggestedFlagHints
        - boundaryReminder
        - attachedAt
